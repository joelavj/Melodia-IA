[tool]
name = "melodia-ia"
version = "0.1.0"
description = "Mélod'IA - A music application built with CustomTkinter"
authors = ["Your Name <your.email@example.com>"]
license = "MIT"

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "Melodia-IA"
version = "0.1.0"
description = "Un application de bureau de lecteur de musique"
requires-python = ">=3.13.14"
readme = "README.md"
authors = [
    {name = "Joela", email = "joelavonjiniaina@gmail.com"}
]
dependencies = [
    "customtkinter>=6.0.0",
    "mutagen>=1.48.1",
    "mysql-connector-python>=26.7.0",
    "pillow>=12.3.0",
    "pygame>=2.6.1",
]

[tool.black]
line-length = 88

[tool.isort]
profile = "black"
